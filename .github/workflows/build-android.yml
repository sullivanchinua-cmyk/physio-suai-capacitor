name: Build Android APK

on:
  workflow_dispatch:      # lets you press "Run workflow" from your phone
  push:
    branches: [main, master]

permissions:
  contents: write         # needed to publish the APK as a Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test FIREBASE_API_KEY secret is available
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ]; then
            echo "ERROR: FIREBASE_API_KEY secret is not set or empty"
            exit 1
          fi
          echo "SUCCESS: FIREBASE_API_KEY secret is present (length: ${#FIREBASE_API_KEY})"
          # Do NOT echo the actual value - GitHub will mask it anyway

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install npm packages
        run: npm install

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "android/ already exists, skipping cap add"
          fi

      - name: Patch AndroidManifest (permissions + notifications)
        run: npm run android:patch

      - name: Sync web files and plugins
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: physio-suai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to a Release (easy download on phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Physio SUAI build ${{ github.run_number }}
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
